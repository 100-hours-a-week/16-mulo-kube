# 업체 DNS가 _ 로 시작하는 CNAME을 받지 않아 ACM DNS 검증을 쓸 수 없다.
# Let's Encrypt HTTP-01로 발급하고, ALB의 /.well-known/acme-challenge/* 규칙(Terraform)이 검증 요청을 Envoy로 넘긴다.
# 발급된 인증서는 acm-sync CronJob이 ACM에 다시 가져와 ALB HTTPS 리스너가 쓴다.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: mulo-gateway
                namespace: edge
                sectionName: http
            # 모든 워커에 dedicated taint가 있어 검증 Pod를 general 노드에 둔다.
            podTemplate:
              spec:
                nodeSelector:
                  workload: general
                tolerations:
                  - key: dedicated
                    operator: Equal
                    value: general
                    effect: NoSchedule
---
# 메인 도메인(mulostudio.p-e.kr)은 업체 웹포워딩으로 가서 HTTP-01 검증이 불가능해 넣지 않는다.
# 서브도메인을 추가할 때는 DNS CNAME(→ ALB)을 먼저 등록한 뒤 여기에 넣는다. 하나라도 실패하면 전체 발급이 실패한다.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mulo-web
  namespace: edge
spec:
  secretName: mulo-web-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  dnsNames:
    - www.mulostudio.p-e.kr
    - api.mulostudio.p-e.kr
    - argocd.mulostudio.p-e.kr
    - grafana.mulostudio.p-e.kr
    - prometheus.mulostudio.p-e.kr
