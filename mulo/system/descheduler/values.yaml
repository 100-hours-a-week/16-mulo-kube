# AZ 장애가 지나간 뒤 한쪽 AZ로 몰린 Pod를 다시 나눈다.
# topologySpreadConstraints는 Pod를 배치할 때만 지켜진다. 장애 중 남은 AZ로 옮겨진 Pod는
# 그 AZ가 돌아와도 그대로 남으므로, descheduler가 규칙을 어긴 Pod를 내보내 스케줄러가 다시 나누게 한다.
kind: Deployment
replicas: 1
# 2분마다 확인한다.
deschedulingInterval: 2m

nodeSelector:
  workload: "system"
tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "system"
    effect: "NoSchedule"

deschedulerPolicy:
  # 한 번에 너무 많이 내보내지 않는다. PDB도 지킨다.
  maxNoOfPodsToEvictPerNamespace: 2
  profiles:
    - name: rebalance-zones
      pluginConfig:
        - name: DefaultEvictor
          args:
            # 다른 노드에 들어갈 자리가 있을 때만 내보낸다.
            nodeFit: true
            podProtections:
              defaultDisabled:
                - "PodsWithLocalStorage"
              extraEnabled:
                - "PodsWithPVC"
        - name: RemovePodsViolatingTopologySpreadConstraint
          args:
            # 앱의 AZ 분산 규칙(DoNotSchedule)만 본다.
            constraints:
              - DoNotSchedule
            namespaces:
              include:
                - "frontend"
                - "backend"
                - "chat"
                - "ai-api"
                - "envoy-gateway-system"
      plugins:
        balance:
          enabled:
            - RemovePodsViolatingTopologySpreadConstraint
    # CoreDNS(kubeadm 관리). AZ 장애로 축출되면 남은 AZ CP로 몰리고, 복구 뒤에도 그대로 남는다.
    # 2026-11-24 2b 훈련 뒤 2a 1개·2c 2개·2b 0개였다. 다음 장애 때 한 AZ에 2개가 있으면 DNS 질의가 더 많이 실패한다.
    # CoreDNS의 분산 규칙은 ScheduleAnyway이고 system-cluster-critical이라 이 profile에서만 따로 허용한다.
    - name: rebalance-coredns
      pluginConfig:
        - name: DefaultEvictor
          args:
            nodeFit: true
            # system-cluster-critical 보호만 푼다(evictSystemCriticalPods는 0.36에서 deprecated).
            podProtections:
              defaultDisabled:
                - "SystemCriticalPods"
            # 복제 수가 3보다 적으면(일부가 이미 내려가 있으면) 옮기지 않는다. 한 번에 규칙을 맞출 만큼만(보통 1개) 내보낸다.
            minReplicas: 3
            labelSelector:
              matchLabels:
                k8s-app: "kube-dns"
        - name: RemovePodsViolatingTopologySpreadConstraint
          args:
            constraints:
              - DoNotSchedule
              - ScheduleAnyway
            namespaces:
              include:
                - "kube-system"
            labelSelector:
              matchLabels:
                k8s-app: "kube-dns"
      plugins:
        balance:
          enabled:
            - RemovePodsViolatingTopologySpreadConstraint
