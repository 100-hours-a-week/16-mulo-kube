# 각 노드의 로그를 한 번씩 수집해 Loki로 보낸다. system 그룹으로 노드 선택을 제한하지 않는다.
# 로그 수집기는 모든 대상 노드에 있어야 한다. system 한 그룹으로 제한하지 않는다.
controller:
  type: "daemonset"
  tolerations:
    -
      operator: "Exists"
alloy:
  configMap:
    create: true
    # 동일 폴더 config.alloy를 내장했다. --set-file로 지정해도 같은 설정을 사용한다.
    content: |
      // 각 DaemonSet Pod는 자신과 같은 노드의 로그만 읽어 중복 수집을 피한다.
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }
      
      // 검색에 필요한 낮은 cardinality 라벨을 붙인다. 컨테이너 로그 본문은 그대로 보낸다.
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label = "container"
        }
        rule {
          target_label = "cluster"
          replacement = "{{ .Values.mulo.clusterName }}"
        }
      }
      
      // Kubernetes pods/log API를 사용하므로 hostPath 로그 마운트가 필요 없다.
      loki.source.kubernetes "pods" {
        targets = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }
      
      loki.write "default" {
        endpoint {
          url = "{{ .Values.mulo.lokiPushUrl }}"
        }
      }
  extraEnv:
    -
      name: "NODE_NAME"
      valueFrom:
        fieldRef:
          fieldPath: "spec.nodeName"
  resources:
    requests:
      cpu: "25m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
# config.alloy가 tpl로 읽는 환경별 값이다.
mulo:
  clusterName: "mulo-v3-prod"
  # Loki의 실제 /loki/api/v1/push URL. 비밀번호를 URL에 넣지 않는다.
  lokiPushUrl: "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
networkPolicy:
  enabled: false
