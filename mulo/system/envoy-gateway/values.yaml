# Envoy Gateway controller는 envoy-gateway-system에, 데이터 플레인 Gateway는 edge에 설치한다.
# Envoy Gateway controller 설치용이다. 데이터 플레인/NodePort는 system/gateway/chart에서 관리한다.
crds:
  enabled: true
# system 워커가 서로 다른 AZ 2곳에 1대씩 있으므로 AZ마다 1개씩 2개를 둔다. 리더 선출로 한 개만 활성이다.
# drain·노드 축소 중에도 1개를 남긴다.
podDisruptionBudget:
  minAvailable: 1
deployment:
  replicas: 2
  pod:
    # 이 차트는 labelSelector를 채우지 않으므로 컨트롤러 Pod 라벨(control-plane: envoy-gateway)을 직접 지정한다.
    topologySpreadConstraints:
      -
        maxSkew: 1
        topologyKey: "topology.kubernetes.io/zone"
        whenUnsatisfiable: "DoNotSchedule"
        nodeTaintsPolicy: "Honor"
        labelSelector:
          matchLabels:
            control-plane: "envoy-gateway"
        matchLabelKeys:
          - "pod-template-hash"
    nodeSelector:
      workload: "system"
    tolerations:
      -
        key: "dedicated"
        operator: "Equal"
        value: "system"
        effect: "NoSchedule"
  # 공식 차트는 deployment.priorityClassName을 읽는다. pod 아래에 두면 무시된다.
  priorityClassName: "mulo-system"
  envoyGateway:
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "300m"
        memory: "512Mi"
# 인증서 생성 Job도 system 노드에 배치한다.
# 공식 차트의 키는 certgen.job.* 이다. certgen.nodeSelector는 무시되어 Job이 갈 노드가 없었다.
certgen:
  job:
    nodeSelector:
      workload: "system"
    tolerations:
      -
        key: "dedicated"
        operator: "Equal"
        value: "system"
        effect: "NoSchedule"
