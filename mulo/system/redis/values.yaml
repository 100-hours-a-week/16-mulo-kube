# 초기 Redis는 비밀번호 없이 사용한다. 접근 제한은 별도 Calico 정책에서 관리한다.
# 인증 분기와 Redis용 Secret은 포함하지 않는다.
namespace: "redis"
# StatefulSet과 앱 접속용 Service 이름이다.
name: "redis"
image:
  # redis-server 실행 파일을 가진 공식 Redis 호환 이미지.
  repository: "redis"
  # 기존 GCP Redis compose에 고정한 이미지 버전을 이어받았다. Docker 공식 Alpine 이미지의 UID/GID를 사용한다.
  tag: "7.4.12-alpine"
  pullPolicy: "IfNotPresent"
service:
  port: 6379
  targetPort: 6379
# EBS CSI와 gp3 StorageClass가 준비된 뒤 설치한다. 초기 용량은 5Gi다.
persistence:
  storageClass: "gp3"
  size: "5Gi"
  accessMode: "ReadWriteOnce"
  # Redis 키를 디스크에 기록한다. Pub/Sub 실시간 메시지는 보존 대상이 아니다.
  appendOnly: "yes"
  # 1초마다 기록 내용을 디스크에 반영한다. 비정상 종료 시 최근 약 1초는 유실될 수 있다.
  appendFsync: "everysec"
resources:
  requests:
    cpu: "25m"
    memory: "128Mi"
  limits:
    cpu: "300m"
    memory: "512Mi"
securityContext:
  # 선택한 이미지의 비루트 UID/GID와 일치시킨다.
  runAsUser: 999
  runAsGroup: 1000
  fsGroup: 1000
probes:
  initialDelaySeconds: 5
  periodSeconds: 10
