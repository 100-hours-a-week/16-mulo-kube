# StatefulSet Pod의 고정 DNS에 사용하는 Service다. 앱은 기존 redis Service로 접속한다.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-headless
  namespace: {{ .Values.namespace }}
spec:
  clusterIP: None
  selector:
    app: {{ .Values.name }}
  ports:
    - name: redis
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: redis
