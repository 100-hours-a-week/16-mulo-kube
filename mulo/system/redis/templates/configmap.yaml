# AOF 파일은 PVC의 /data에 기록한다. Pub/Sub 메시지는 AOF로 저장·재전송되지 않는다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-config
  namespace: {{ .Values.namespace }}
data:
  redis.conf: |
    bind 0.0.0.0
    port {{ .Values.service.targetPort }}
    # 초기 무인증 구성: 접근 허용·차단은 별도 Calico 정책에서 관리한다.
    protected-mode no
    save ""
    appendonly {{ .Values.persistence.appendOnly }}
    appendfsync {{ .Values.persistence.appendFsync }}
    dir /data
