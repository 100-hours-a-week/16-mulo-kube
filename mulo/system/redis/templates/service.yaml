# 클러스터 내부 앱만 접근한다. 외부 LoadBalancer는 만들지 않는다.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.name }}
  ports:
    - name: redis
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: redis
