# Redis master 1 + replica 1. AZ(2a·2c)마다 1개, 각자 자기 AZ의 PVC를 쓴다.
# 앱은 HAProxy(Service "redis")를 거쳐 항상 master 하나에만 붙으므로 채팅 Pub/Sub도 한 곳에서 공유된다.
# 대화 문맥·로그아웃 표식 같은 Redis 키는 replica에 복제되어, master가 바뀌어도 이어진다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  serviceName: {{ .Values.name }}-headless
  replicas: {{ .Values.replicas }}
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
      annotations:
        # 노드를 줄일 때 CA가 Redis를 옮기지 않게 한다. 옮기면 채팅 Pub/Sub이 잠깐 끊긴다.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload: system
      tolerations:
        - key: dedicated
          operator: Equal
          value: system
          effect: NoSchedule
      # AZ마다 1개. 같은 AZ에 둘이 뜨면 그 AZ 장애 때 둘 다 잃는다.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels:
                  app: {{ .Values.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
      containers:
        - name: redis
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # 시작할 때 지금 master를 찾아 자기가 master인지 replica인지 정한다(templates/scripts.yaml).
          command: [sh, /scripts/start-redis.sh]
          ports:
            - name: redis
              containerPort: {{ .Values.service.targetPort }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Redis 포트 연결로 준비 상태와 생존 여부를 확인한다.
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: {{ .Values.probes.periodSeconds }}
          volumeMounts:
            - name: config
              mountPath: /etc/redis
              readOnly: true
            - name: data
              mountPath: /data
            - name: scripts
              mountPath: /scripts
              readOnly: true
            # 루트 파일시스템이 읽기 전용이라, 실행할 때 만든 설정은 여기에 쓴다.
            - name: conf
              mountPath: /tmp/conf
      volumes:
        - name: config
          configMap:
            name: {{ .Values.name }}-config
        - name: scripts
          configMap:
            name: {{ .Values.name }}-scripts
        - name: conf
          emptyDir: {}
  # StatefulSet이 redis-0에 연결할 전용 PVC를 만든다.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        storageClassName: {{ .Values.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
