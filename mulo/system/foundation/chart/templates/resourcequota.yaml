# 앱 namespace에 자원 상한을 둔다.
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
  namespace: {{ .Values.resourceQuotas.frontend.namespace }}
spec:
  hard:
    requests.cpu: "{{ .Values.resourceQuotas.frontend.requests.cpu }}"
    requests.memory: "{{ .Values.resourceQuotas.frontend.requests.memory }}"
    limits.cpu: "{{ .Values.resourceQuotas.frontend.limits.cpu }}"
    limits.memory: "{{ .Values.resourceQuotas.frontend.limits.memory }}"
    pods: "{{ .Values.resourceQuotas.frontend.pods }}"
---
