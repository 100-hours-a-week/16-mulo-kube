    requests.memory: "{{ .Values.resourceQuotas.backend.requests.memory }}"
    limits.cpu: "{{ .Values.resourceQuotas.backend.limits.cpu }}"
    limits.memory: "{{ .Values.resourceQuotas.backend.limits.memory }}"
    pods: "{{ .Values.resourceQuotas.backend.pods }}"
