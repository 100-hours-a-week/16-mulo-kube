# 서비스와 플랫폼의 자원·권한·네트워크 경계를 나누는 namespace 12개.
# mulo.io/gateway-access가 true인 namespace만 Gateway 경로를 받을 수 있다.

---
# 프론트엔드
apiVersion: v1
kind: Namespace
metadata:
  name: frontend
  labels:
    app.kubernetes.io/part-of: "mulo"
    mulo.io/workload-group: "general"
    mulo.io/gateway-access: "true"

---
# 백엔드 API
apiVersion: v1
kind: Namespace
metadata:
  name: backend
  labels:
    app.kubernetes.io/part-of: "mulo"
    mulo.io/workload-group: "general"
    mulo.io/gateway-access: "true"

---
# 채팅 서버
