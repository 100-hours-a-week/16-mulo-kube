# Vault의 비밀 값은 기록하지 않는다. ESO가 TokenRequest로 짧은 수명의 토큰을 요청한다.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.storeName }}
spec:
  conditions:
    - namespaces:
        - {{ .Values.allowedNamespaces.frontend }}
        - {{ .Values.allowedNamespaces.backend }}
        - {{ .Values.allowedNamespaces.chat }}
        - {{ .Values.allowedNamespaces.aiApi }}
        - {{ .Values.allowedNamespaces.redis }}
        - {{ .Values.allowedNamespaces.monitoring }}
        - {{ .Values.allowedNamespaces.argocd }}
  provider:
    vault:
      server: {{ .Values.vault.server }}
      path: {{ .Values.vault.path }}
      version: {{ .Values.vault.version }}
      caProvider:
        type: Secret
        name: {{ .Values.vault.caProvider.name }}
        key: {{ .Values.vault.caProvider.key }}
        namespace: {{ .Values.vault.caProvider.namespace }}
      auth:
        kubernetes:
          mountPath: {{ .Values.vault.kubernetes.mountPath }}
          role: {{ .Values.vault.kubernetes.role }}
          serviceAccountRef:
            name: {{ .Values.serviceAccountName }}
            namespace: {{ .Values.namespace }}
            audiences:
              - {{ .Values.vault.kubernetes.audience }}
