# Grafana가 사용할 admin Secret을 Vault에서 동기화한다. 값 자체는 Git에 저장하지 않는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.grafanaAdmin.name }}
  namespace: {{ .Values.grafanaAdmin.namespace }}
spec:
  refreshInterval: {{ .Values.grafanaAdmin.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.grafanaAdmin.targetName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.grafanaAdmin.user.secretKey }}
      remoteRef:
        key: {{ .Values.grafanaAdmin.user.remoteRef.key }}
        property: {{ .Values.grafanaAdmin.user.remoteRef.property }}
    - secretKey: {{ .Values.grafanaAdmin.password.secretKey }}
      remoteRef:
        key: {{ .Values.grafanaAdmin.password.remoteRef.key }}
        property: {{ .Values.grafanaAdmin.password.remoteRef.property }}
