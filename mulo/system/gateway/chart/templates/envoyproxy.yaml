# AWS ALB → general 노드의 NodePort → Envoy → 각 앱의 ClusterIP 순서로 연결한다.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.proxyName }}
  namespace: {{ .Values.namespace }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      # Envoy 수는 HPA가 정합니다. HPA가 있으면 envoyDeployment.replicas는 무시되므로 적지 않습니다.
      envoyHpa:
        minReplicas: {{ .Values.envoy.autoscaling.minReplicas }}
        maxReplicas: {{ .Values.envoy.autoscaling.maxReplicas }}
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: {{ .Values.envoy.autoscaling.targetCPUUtilization }}
      # 노드 교체(CA scale-down, drain) 중에도 Envoy가 최소 1개는 남게 합니다.
      envoyPDB:
        minAvailable: {{ .Values.envoy.pdbMinAvailable }}
      envoyDeployment:
        pod:
          nodeSelector:
            workload: general
          tolerations:
            - key: dedicated
              operator: Equal
              value: general
              effect: NoSchedule
          priorityClassName: {{ .Values.envoy.priorityClassName }}
          # general 워커가 서로 다른 AZ 2곳에 있으므로 Envoy도 AZ마다 나눠 ALB 경로가 한 AZ에 묶이지 않게 한다.
          # 장애 AZ 노드(unreachable taint)는 계산에서 빼서 남은 AZ에 다시 뜨게 한다.
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              nodeTaintsPolicy: Honor
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: {{ .Values.gatewayName }}
                  gateway.envoyproxy.io/owning-gateway-namespace: {{ .Values.namespace }}
              matchLabelKeys:
                - pod-template-hash
        container:
          resources:
            requests:
              cpu: {{ .Values.envoy.resources.requests.cpu }}
              memory: {{ .Values.envoy.resources.requests.memory }}
            limits:
              cpu: {{ .Values.envoy.resources.limits.cpu }}
              memory: {{ .Values.envoy.resources.limits.memory }}
      envoyService:
        type: NodePort
        externalTrafficPolicy: Cluster
        # Service의 port를 merge key로 사용해 자동 생성되는 targetPort는 보존한다.
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: {{ .Values.listener.port }}
                  nodePort: {{ .Values.envoy.nodePort }}
