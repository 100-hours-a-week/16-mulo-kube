# Redis StatefulSet. PVC는 StatefulSet이 만들어 Argo CD가 삭제하지 않는다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  source:
    repoURL: https://github.com/100-hours-a-week/16-mulo-kube.git
    targetRevision: main
    path: mulo/system/redis
    helm:
      releaseName: redis
  syncPolicy:
    # 자식 Application끼리는 sync-wave가 생성 순서만 정하고 준비 완료를 기다리지 않는다.
    # CRD·Secret이 아직 없어 실패하면 재시도로 따라잡는다.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
