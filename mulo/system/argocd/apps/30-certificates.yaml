# Let's Encrypt ClusterIssuer·Certificate와 ACM 동기화 CronJob.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: certificates
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: edge
  source:
    repoURL: https://github.com/100-hours-a-week/16-mulo-kube.git
    targetRevision: main
    path: mulo/system/certificates
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
