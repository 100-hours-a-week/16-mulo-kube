# 노드 자동 증설. Pending Pod를 보고 역할별 ASG desired를 늘리고, 남는 노드는 줄인다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-autoscaler
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  sources:
    - repoURL: https://kubernetes.github.io/autoscaler
      chart: cluster-autoscaler
      targetRevision: 9.60.0
      helm:
        releaseName: cluster-autoscaler
        valueFiles:
        - $values/mulo/system/cluster-autoscaler/values.yaml
    # values 파일만 이 Git 저장소에서 읽는다.
    - repoURL: https://github.com/100-hours-a-week/16-mulo-kube.git
      targetRevision: main
      ref: values
  syncPolicy:
    # 자식 Application끼리는 sync-wave가 생성 순서만 정하고 준비 완료를 기다리지 않는다.
    # CRD·Secret이 아직 없어 실패하면 재시도로 따라잡는다.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
