# 초기 구축용 고정 구성이다. Helm --namespace도 이 값과 같게 지정한다.
# 앱 이미지는 ECR에 게시된 태그로 지정하며, 비밀 값은 Git에 넣지 않는다.
namespace: "ai-api"
app:
  # 리소스 이름과 Pod의 app 라벨이다. Service selector도 같은 값을 참조한다.
  name: "ai-api"
# Pod 수는 HPA가 정한다(Cloud Wiki 3.10). 장애 대비로 최소 2개에서 시작한다.
# maxReplicas는 부하테스트 전 초기 상한이다. 측정 결과를 보고 조정하고, foundation의 ResourceQuota도 같이 맞춘다.
autoscaling:
  minReplicas: 2
  maxReplicas: 4
  # Pod CPU 사용률(requests 대비 %)이 이 값을 넘으면 늘린다.
  targetCPUUtilization: 70
  # 모델을 올리는 데 시간이 걸려 너무 자주 늘고 줄지 않게 한다.
  scaleDownStabilizationSeconds: 600
  # KEDA(ScaledObject)로 Prometheus 지표 기반 오토스케일링. false면 기존 CPU HPA를 쓴다.
  keda:
    enabled: true
    prometheusAddress: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
    # 기동 직후 Pod의 CPU는 사용률 계산에서 뺀다(초).
    startupGraceSeconds: 180
    extraTriggers: []
  # 노드를 비울 때 최소 이만큼은 살아 있게 한다.
  pdbMinAvailable: 1
# Ready가 된 뒤 안정 상태로 인정할 때까지의 시간(초, 0 이상).
minReadySeconds: 5
# 롤백에 남겨 둘 ReplicaSet 수(정수).
revisionHistoryLimit: 3
strategy:
  # 추가 Pod 허용 수/비율. 숫자 또는 "25%" 같은 문자열.
  maxSurge: 1
  # 배포 중 사용 불가 Pod 허용 수/비율. maxSurge와 둘 다 0일 수 없다.
  maxUnavailable: 0
image:
  # ECR 등 실제 이미지 저장소 URI. 태그를 포함하지 않는다.
  repository: "840255883218.dkr.ecr.ap-northeast-2.amazonaws.com/mulo-v3-prod/ai"
  # ECR에 존재하는 배포 이미지 태그다.
  tag: "1.12.0"
  # Always / IfNotPresent / Never 중 선택.
  pullPolicy: "IfNotPresent"
service:
  # ClusterIP Service 이름이다. HTTPRoute가 이 Service로 전달한다.
  name: "ai-api"
  # 서비스가 수신하는 포트와 컨테이너가 실제 수신하는 포트(1~65535).
  port: 80
  targetPort: 8000
  # HTTPRoute·메트릭 설정에서 식별할 포트 이름.
  portName: "http"
configMap:
  # Deployment의 envFrom이 이 이름으로 ConfigMap을 참조한다.
  name: "ai-api-config"
  # AI main의 launcher는 한 이미지에서 Gateway·모더레이션·임베딩·Worker를 실행한다. 임의로 여러 Deployment로 나누지 않는다.
  # 앱 배포 단계에서 실제 LLM provider·RunPod 주소·선택 API 키를 AI 팀 설정과 맞춘다. 현재는 이미지를 배포하지 않는다.
  data:
    TZ: "Asia/Seoul"
    APP_ENV: "prod"
    AI_CLIENT_MODE: "real"
    GATEWAY_PORT: "8000"
    MODERATION_PORT: "8001"
    EMBEDDING_PORT: "8002"
    # 카나리 동안은 끈다. AI DB가 아직 GCP의 복제본이라 워커가 쓰면 복제가 깨진다(2026-11-20 오전에 겪음).
    # AI DB를 승격한 뒤 "true"로 되돌린다. GCP AI 워커가 멈춘 것을 확인한 다음에만 켠다(두 워커가 동시에 돌면 안 된다).
    RUN_WORKER: "false"
    LLM_MODEL: "claude-sonnet-5"
    TEXT_EMBEDDING_MODEL: "text-embedding-3-small"
    TEXT_EMBEDDING_DIM: "1536"
    CLIP_MODEL: "openai/clip"
    CLIP_EMBEDDING_DIM: "768"
    LOCAL_LLM_URL: "https://72c1cla8is49um-8000.proxy.runpod.net/v1/chat/completions"
    LOCAL_LLM_MODEL: "gemma-3-12b"
    BACKEND_INTERNAL_URL: "http://backend.backend.svc.cluster.local:80/"
    # 사진 서명은 S3 사전 서명 URL로 한다(AI 1.12.0의 PHOTO_STORAGE_PROVIDER). 자격 증명은 노드 IAM 역할(mulo-v3-prod-ai)이다.
    # 노드의 IMDS 홉 제한 2와 역할의 s3:GetObject(ai-photos-read) 설정이 필요하다(2026-11-21 콘솔에서 적용).
    PHOTO_STORAGE_PROVIDER: "s3"
    S3_PHOTO_BUCKET: "mulo-v3-prod-840255883218-images"
    AWS_REGION: "ap-northeast-2"
# 2026-11-19 VPA 추천 반영(VPA target 200m/2692Mi, 실측 메모리 최대 2715Mi). 트래픽이 쌓이면 `kubectl -n <ns> describe vpa <앱>`의 Target으로 다시 맞춘다.
# 메모리 request = VPA target 올림, CPU request = VPA target(기동 시 CPU 급증으로 KEDA가 늘지 않게 여유), limit = 기존 수준(JVM 힙이 limit 기준).
resources:
  requests:
    cpu: "250m"
    memory: "2816Mi"
  limits:
    cpu: "2"
    memory: "5Gi"
# 실제 앱 소스에서 확인한 포트와 헬스체크 경로다.
probes:
  startup:
    # 실제 앱에서 응답하는 기동 확인 경로와 포트.
    path: "/health"
    port: 8000
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60
  liveness:
    # 프로세스 복구가 필요한 상황만 실패시키는 생존 확인 경로.
    path: "/health"
    port: 8000
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    # 트래픽을 받을 수 있는지 판단하는 준비 확인 경로.
    path: "/health"
    port: 8000
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
serviceAccount:
  name: "ai-api"
  # Kubernetes API 토큰이 필요한 앱만 true. 일반 앱은 false.
  automountServiceAccountToken: false
# Pod 종료 전 유예 시간(초).
terminationGracePeriodSeconds: 30
securityContext:
  allowPrivilegeEscalation: false
  # Pod에서 제거할 리눅스 권한. ALL이면 전부 제거한다.
  dropCapability: "ALL"
# Vault 경로/필드와 앱이 읽는 환경변수 이름을 함께 맞춘다.
externalSecrets:
  # ESO 동기화 주기 문자열. 예: "1h".
  refreshInterval: "1h"
  storeRef:
    name: "mulo-vault"
    # ClusterSecretStore 또는 SecretStore.
    kind: "ClusterSecretStore"
  # 생성할 Kubernetes Secret 이름이다. Deployment가 이 값을 직접 참조한다.
  targetName: "ai-api-secrets"
  # mulo/prod/apps/ai의 모든 키를 이름 그대로 환경변수로 넣는다. Vault에는 환경변수 이름(대문자)으로 저장한다.
  # 서비스끼리 같은 값을 써야 하는 토큰(AI_INTERNAL_TOKEN 등)은 각 앱 경로에 같은 값으로 넣는다.
  extractKey: "mulo/prod/apps/ai"
  data: {}
# 노드의 workload 라벨과 일치시킨다.
nodeSelector:
  workload: "ai"
# 해당 워커 그룹의 dedicated taint를 허용한다.
toleration:
  key: "dedicated"
  operator: "Equal"
  value: "ai"
  effect: "NoSchedule"
# VPA 추천(updateMode Off). 추천 범위의 하한/상한. 추천값을 보고 위 resources를 사람이 고친다.
vpa:
  enabled: true
  minAllowed:
    cpu: "200m"
    memory: "2Gi"
  maxAllowed:
    cpu: "3"
    memory: "7Gi"
