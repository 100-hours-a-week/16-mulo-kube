# 비밀이 아닌 환경변수만 담는다. 비밀번호와 토큰은 여기에 넣지 않는다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configMap.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.app.name }}
data:
  TZ: "{{ .Values.configMap.data.TZ }}"
  APP_ENV: "{{ .Values.configMap.data.APP_ENV }}"
  AI_CLIENT_MODE: "{{ .Values.configMap.data.AI_CLIENT_MODE }}"
  GATEWAY_PORT: "{{ .Values.configMap.data.GATEWAY_PORT }}"
  MODERATION_PORT: "{{ .Values.configMap.data.MODERATION_PORT }}"
  EMBEDDING_PORT: "{{ .Values.configMap.data.EMBEDDING_PORT }}"
  RUN_WORKER: "{{ .Values.configMap.data.RUN_WORKER }}"
