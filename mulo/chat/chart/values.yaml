# 초기 구축용 고정 구성이다. Helm --namespace도 이 값과 같게 지정한다.
# 앱 이미지는 ECR에 게시된 태그로 지정하며, 비밀 값은 Git에 넣지 않는다.
namespace: "chat"
app:
  # 리소스 이름과 Pod의 app 라벨이다. Service selector도 같은 값을 참조한다.
  name: "chat"
# 초기 Pod 수다. 자동 확장 템플릿은 포함하지 않는다.
replicaCount: 1
# Ready가 된 뒤 안정 상태로 인정할 때까지의 시간(초, 0 이상).
minReadySeconds: 5
# 롤백에 남겨 둘 ReplicaSet 수(정수).
revisionHistoryLimit: 3
strategy:
  # 추가 Pod 허용 수/비율. 숫자 또는 "25%" 같은 문자열.
  maxSurge: 1
  # 배포 중 사용 불가 Pod 허용 수/비율. maxSurge와 둘 다 0일 수 없다.
  maxUnavailable: 0
image:
  # ECR 등 실제 이미지 저장소 URI. 태그를 포함하지 않는다.
  repository: "840255883218.dkr.ecr.ap-northeast-2.amazonaws.com/mulo-v3-prod/chat"
  # ECR에 존재하는 배포 이미지 태그다.
  tag: "1.3.0"
  # Always / IfNotPresent / Never 중 선택.
  pullPolicy: "IfNotPresent"
service:
  # ClusterIP Service 이름이다. HTTPRoute가 이 Service로 전달한다.
  name: "chat"
  # 서비스가 수신하는 포트와 컨테이너가 실제 수신하는 포트(1~65535).
  port: 80
  targetPort: 8081
  # HTTPRoute·메트릭 설정에서 식별할 포트 이름.
  portName: "http"
configMap:
  # backend 원본 Deployment도 이 이름으로 ConfigMap을 참조한다.
  name: "chat-config"
  # CHAT main의 application.yaml이 읽는 실제 환경변수 이름을 사용한다.
  # 채팅 서버들이 Redis Pub/Sub으로 메시지를 공유한다. Pod 수와 관계없이 같은 prod 채널을 사용한다.
  # 모더레이션은 AI Gateway 8000의 /api/moderation 경로를 통해 같은 컨테이너의 8001로 전달된다.
  data:
    TZ: "Asia/Seoul"
    SPRING_PROFILES_ACTIVE: "prod"
    CHAT_DB_URL: "jdbc:mysql://mulo-v3-prod-chat.c9acwe6m8g1e.ap-northeast-2.rds.amazonaws.com:3306/mulo_chat?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul"
    CHAT_DB_USERNAME: "mulo_admin"
    CHAT_WS_ALLOWED_ORIGINS: "https://mulostudio.p-e.kr"
    CHAT_BACKEND_URL: "http://backend.backend.svc.cluster.local:80"
    CHAT_MODERATION_AI_BASE_URL: "http://ai-api.ai-api.svc.cluster.local:80"
    CHAT_DELIVERY_ENABLED: "true"
    CHAT_REDIS_HOST: "redis.redis.svc.cluster.local"
    CHAT_REDIS_PORT: "6379"
    CHAT_REDIS_TLS: "false"
    CHAT_REDIS_USERNAME: ""
    CHAT_REDIS_PASSWORD: ""
    CHAT_DELIVERY_ENVIRONMENT: "prod"
    CHAT_DEPLOYMENT_ENVIRONMENT: "prod"
resources:
  requests:
    # CPU는 "250m", 메모리는 "512Mi"처럼 단위를 포함한 문자열로 입력한다.
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"
# 실제 앱 소스에서 확인한 포트와 헬스체크 경로다.
probes:
  startup:
    # 실제 앱에서 응답하는 기동 확인 경로와 포트.
    path: "/health"
    port: 8081
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60
  liveness:
    # 프로세스 복구가 필요한 상황만 실패시키는 생존 확인 경로.
    path: "/health"
    port: 8081
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    # 트래픽을 받을 수 있는지 판단하는 준비 확인 경로.
    path: "/health"
    port: 8081
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
serviceAccount:
  name: "chat"
  # Kubernetes API 토큰이 필요한 앱만 true. 일반 앱은 false.
  automountServiceAccountToken: false
# Pod 종료 전 유예 시간(초).
terminationGracePeriodSeconds: 90
securityContext:
  allowPrivilegeEscalation: false
  # Pod에서 제거할 리눅스 권한. ALL이면 전부 제거한다.
  dropCapability: "ALL"
# chat 이미지에 /bin/sh와 sleep이 있고 앱이 SIGTERM에 연결을 정리하는지 확인한다.
lifecycle:
  preStop:
    # 종료 신호 후 기존 연결을 정리하도록 기다리는 시간(초).
    sleepSeconds: 10
# Vault 경로/필드와 앱이 읽는 환경변수 이름을 함께 맞춘다.
externalSecrets:
  # ESO 동기화 주기 문자열. 예: "1h".
  refreshInterval: "1h"
  storeRef:
    name: "mulo-vault"
    # ClusterSecretStore 또는 SecretStore.
    kind: "ClusterSecretStore"
  # 생성할 Kubernetes Secret 이름이다. Deployment가 이 값을 직접 참조한다.
  targetName: "chat-secrets"
  # 서비스 사이에서 같은 값을 써야 하는 인증 토큰은 shared/service-auth의 같은 필드를 참조한다. 비밀 본문은 Git에 저장하지 않는다.
  data:
    chatDbPassword:
      secretKey: "CHAT_DB_PASSWORD"
      remoteRef:
        key: "mulo/prod/apps/chat"
        property: "chat_db_password"
    chatInternalApiKey:
      secretKey: "CHAT_INTERNAL_API_KEY"
      remoteRef:
        key: "mulo/prod/shared/service-auth"
        property: "chat_internal_api_key"
    aiInternalToken:
      secretKey: "AI_INTERNAL_TOKEN"
      remoteRef:
        key: "mulo/prod/shared/service-auth"
        property: "ai_internal_token"
# 기존 GCP URL map의 /ws 접두사를 보존한다. 실제 WebSocket handshake 경로와 대조한다.
httpRoute:
  # 연결할 Gateway의 이름, namespace, listener 이름.
  parentRef:
    name: "mulo-gateway"
    namespace: "edge"
    sectionName: "http"
  # 이 서비스가 소유한 실제 호스트 이름.
  hostnames:
    primary: "api.mulostudio.p-e.kr"
    secondary: "mulostudio.p-e.kr"
  # 이 서비스로 보낼 경로. type은 PathPrefix 또는 Exact.
  paths:
    first:
      type: "PathPrefix"
      value: "/ws"
  # request/backendRequest 등의 duration. WebSocket은 실제 타임아웃 정책을 확인한다.
  timeouts:
    request: "0s"
    backendRequest: "0s"
# 노드의 workload 라벨과 일치시킨다.
nodeSelector:
  workload: "chat"
# 해당 워커 그룹의 dedicated taint를 허용한다.
toleration:
  key: "dedicated"
  operator: "Equal"
  value: "chat"
  effect: "NoSchedule"
