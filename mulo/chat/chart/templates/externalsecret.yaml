# Vault 필드를 앱 환경변수 이름으로 동기화한다. 비밀 값 자체는 기록하지 않는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.app.name }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.app.name }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef.name }}
    kind: {{ .Values.externalSecrets.storeRef.kind }}
  target:
    name: {{ .Values.externalSecrets.targetName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.externalSecrets.data.chatDbPassword.secretKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.data.chatDbPassword.remoteRef.key }}
        property: {{ .Values.externalSecrets.data.chatDbPassword.remoteRef.property }}
    - secretKey: {{ .Values.externalSecrets.data.chatInternalApiKey.secretKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.data.chatInternalApiKey.remoteRef.key }}
        property: {{ .Values.externalSecrets.data.chatInternalApiKey.remoteRef.property }}
    - secretKey: {{ .Values.externalSecrets.data.aiInternalToken.secretKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.data.aiInternalToken.remoteRef.key }}
        property: {{ .Values.externalSecrets.data.aiInternalToken.remoteRef.property }}
