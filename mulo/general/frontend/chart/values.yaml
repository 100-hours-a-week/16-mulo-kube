# 초기 구축용 고정 구성이다. Helm --namespace도 이 값과 같게 지정한다.
# 앱 이미지는 ECR에 게시된 태그로 지정하며, 비밀 값은 Git에 넣지 않는다.
namespace: "frontend"
app:
  # 리소스 이름과 Pod의 app 라벨이다. Service selector도 같은 값을 참조한다.
  name: "frontend"
# Pod 수는 HPA가 정한다(Cloud Wiki 3.10). 장애 대비로 최소 2개에서 시작한다.
# maxReplicas는 부하테스트 전 초기 상한이다. 측정 결과를 보고 조정하고, foundation의 ResourceQuota도 같이 맞춘다.
autoscaling:
  # 워커가 역할별로 AZ 2곳에 1대씩 있다. AZ마다 2개씩(노드마다 2개) 최소 4개를 두고, 부하에 따라 8개까지 늘린다.
  # AZ 분산은 deployment의 topologySpreadConstraints(maxSkew 1)가 맞춘다.
  minReplicas: 4
  maxReplicas: 8
  # Pod CPU 사용률(requests 대비 %)이 이 값을 넘으면 늘린다.
  targetCPUUtilization: 70
  scaleDownStabilizationSeconds: 300
  # KEDA(ScaledObject)로 Prometheus 지표 기반 오토스케일링. false면 기존 CPU HPA를 쓴다.
  keda:
    enabled: true
    prometheusAddress: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
    # 기동 직후 Pod의 CPU는 사용률 계산에서 뺀다(초).
    startupGraceSeconds: 180
    extraTriggers: []
  # 노드를 비울 때 최소 이만큼은 살아 있게 한다.
  pdbMinAvailable: 1
# Ready가 된 뒤 안정 상태로 인정할 때까지의 시간(초, 0 이상).
minReadySeconds: 5
# 롤백에 남겨 둘 ReplicaSet 수(정수).
revisionHistoryLimit: 3
strategy:
  # 추가 Pod 허용 수/비율. 숫자 또는 "25%" 같은 문자열.
  maxSurge: 1
  # 배포 중 사용 불가 Pod 허용 수/비율. maxSurge와 둘 다 0일 수 없다.
  maxUnavailable: 0
image:
  # ECR 등 실제 이미지 저장소 URI. 태그를 포함하지 않는다.
  repository: "840255883218.dkr.ecr.ap-northeast-2.amazonaws.com/mulo-v3-prod/frontend"
  # ECR에 존재하는 배포 이미지 태그다.
  tag: "1.18.2"
  # Always / IfNotPresent / Never 중 선택.
  pullPolicy: "IfNotPresent"
service:
  # ClusterIP Service 이름이다. HTTPRoute가 이 Service로 전달한다.
  name: "frontend"
  # 서비스가 수신하는 포트와 컨테이너가 실제 수신하는 포트(1~65535).
  port: 80
  targetPort: 3000
  # HTTPRoute·메트릭 설정에서 식별할 포트 이름.
  portName: "http"
# FE는 Vite 정적 빌드라 런타임 환경변수를 읽지 않으므로 ConfigMap을 두지 않는다.
# VITE_API_BASE_URL, VITE_KAKAO_MAP_APP_KEY, VITE_SENTRY_DSN은 이미지 빌드 단계에서 설정한다.
# 2026-11-19 VPA 추천 반영(VPA target 25m/250Mi(메모리 250Mi는 VPA 기본 하한, 실측 64Mi)). 트래픽이 쌓이면 `kubectl -n <ns> describe vpa <앱>`의 Target으로 다시 맞춘다.
# 메모리 request = VPA target 올림, CPU request = VPA target(기동 시 CPU 급증으로 KEDA가 늘지 않게 여유), limit = 기존 수준(JVM 힙이 limit 기준).
resources:
  requests:
    cpu: "25m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"
# 실제 앱 소스에서 확인한 포트와 헬스체크 경로다.
probes:
  startup:
    # 실제 앱에서 응답하는 기동 확인 경로와 포트.
    path: "/"
    port: 3000
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60
  liveness:
    # 프로세스 복구가 필요한 상황만 실패시키는 생존 확인 경로.
    path: "/"
    port: 3000
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    # 트래픽을 받을 수 있는지 판단하는 준비 확인 경로.
    path: "/"
    port: 3000
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
serviceAccount:
  name: "frontend"
  # Kubernetes API 토큰이 필요한 앱만 true. 일반 앱은 false.
  automountServiceAccountToken: false
# Pod 종료 전 유예 시간(초).
terminationGracePeriodSeconds: 30
# kubelet의 sleep preStop을 사용하므로 이미지에 셸이 필요 없다(chat과 같은 방식).
lifecycle:
  preStop:
    # 종료 신호 전에 기다리는 시간(초). terminationGracePeriodSeconds보다 충분히 짧아야 한다.
    sleepSeconds: 10
securityContext:
  allowPrivilegeEscalation: false
  # Pod에서 제거할 리눅스 권한. ALL이면 전부 제거한다.
  dropCapability: "ALL"
# 웹 도메인의 기본 경로를 받는다. /api·/image·/ws는 더 구체적인 다른 앱 경로가 우선한다.
httpRoute:
  # 연결할 Gateway의 이름, namespace, listener 이름.
  parentRef:
    name: "mulo-gateway"
    namespace: "edge"
    sectionName: "http"
  # 이 서비스가 소유한 실제 호스트 이름.
  hostnames:
    primary: "mulostudio.com"
    # 메인 도메인은 업체 DNS에서 CNAME을 걸 수 없어 www로 서비스한다.
    www: "www.mulostudio.com"
  # 이 서비스로 보낼 경로. type은 PathPrefix 또는 Exact.
  paths:
    first:
      type: "PathPrefix"
      value: "/"
  # request/backendRequest 등의 duration. WebSocket은 실제 타임아웃 정책을 확인한다.
  timeouts:
    request: "60s"
    backendRequest: "55s"
# 노드의 workload 라벨과 일치시킨다.
nodeSelector:
  workload: "general"
# 해당 워커 그룹의 dedicated taint를 허용한다.
toleration:
  key: "dedicated"
  operator: "Equal"
  value: "general"
  effect: "NoSchedule"
# VPA 추천(updateMode Off). 추천 범위의 하한/상한. 추천값을 보고 위 resources를 사람이 고친다.
vpa:
  enabled: true
  minAllowed:
    cpu: "20m"
    memory: "64Mi"
  maxAllowed:
    cpu: "1"
    memory: "1Gi"
