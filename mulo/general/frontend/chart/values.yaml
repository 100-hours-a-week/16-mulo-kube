# 초기 구축용 고정 구성이다. Helm --namespace도 이 값과 같게 지정한다.
# 앱 이미지는 ECR에 게시된 태그로 지정하며, 비밀 값은 Git에 넣지 않는다.
namespace: "frontend"
app:
  # 리소스 이름과 Pod의 app 라벨이다. Service selector도 같은 값을 참조한다.
  name: "frontend"
# 초기 Pod 수다. 자동 확장 템플릿은 포함하지 않는다.
replicaCount: 1
# Ready가 된 뒤 안정 상태로 인정할 때까지의 시간(초, 0 이상).
minReadySeconds: 5
# 롤백에 남겨 둘 ReplicaSet 수(정수).
revisionHistoryLimit: 3
strategy:
  # 추가 Pod 허용 수/비율. 숫자 또는 "25%" 같은 문자열.
  maxSurge: 1
  # 배포 중 사용 불가 Pod 허용 수/비율. maxSurge와 둘 다 0일 수 없다.
  maxUnavailable: 0
image:
  # ECR 등 실제 이미지 저장소 URI. 태그를 포함하지 않는다.
  repository: "840255883218.dkr.ecr.ap-northeast-2.amazonaws.com/mulo-v3-prod/frontend"
  # ECR에 존재하는 배포 이미지 태그다.
  tag: "1.17.0"
  # Always / IfNotPresent / Never 중 선택.
  pullPolicy: "IfNotPresent"
service:
  # ClusterIP Service 이름이다. HTTPRoute가 이 Service로 전달한다.
  name: "frontend"
  # 서비스가 수신하는 포트와 컨테이너가 실제 수신하는 포트(1~65535).
  port: 80
  targetPort: 3000
  # HTTPRoute·메트릭 설정에서 식별할 포트 이름.
  portName: "http"
configMap:
  # backend 원본 Deployment도 이 이름으로 ConfigMap을 참조한다.
  name: "frontend-config"
  # FE main은 Vite 정적 빌드이며 런타임 ConfigMap으로 VITE_* 값이 바뀌지 않는다.
  # 빌드 단계에서 VITE_API_BASE_URL, VITE_KAKAO_MAP_APP_KEY, VITE_SENTRY_DSN을 설정한다.
  data:
    TZ: "Asia/Seoul"
resources:
  requests:
    # CPU는 "250m", 메모리는 "512Mi"처럼 단위를 포함한 문자열로 입력한다.
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
# 실제 앱 소스에서 확인한 포트와 헬스체크 경로다.
probes:
  startup:
    # 실제 앱에서 응답하는 기동 확인 경로와 포트.
    path: "/"
    port: 3000
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60
  liveness:
    # 프로세스 복구가 필요한 상황만 실패시키는 생존 확인 경로.
    path: "/"
    port: 3000
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    # 트래픽을 받을 수 있는지 판단하는 준비 확인 경로.
    path: "/"
    port: 3000
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
serviceAccount:
  name: "frontend"
  # Kubernetes API 토큰이 필요한 앱만 true. 일반 앱은 false.
  automountServiceAccountToken: false
# Pod 종료 전 유예 시간(초).
terminationGracePeriodSeconds: 30
securityContext:
  allowPrivilegeEscalation: false
  # Pod에서 제거할 리눅스 권한. ALL이면 전부 제거한다.
  dropCapability: "ALL"
# 웹 도메인의 기본 경로를 받는다. /api·/image·/ws는 더 구체적인 다른 앱 경로가 우선한다.
httpRoute:
  # 연결할 Gateway의 이름, namespace, listener 이름.
  parentRef:
    name: "mulo-gateway"
    namespace: "edge"
    sectionName: "http"
  # 이 서비스가 소유한 실제 호스트 이름.
  hostnames:
    primary: "mulostudio.p-e.kr"
  # 이 서비스로 보낼 경로. type은 PathPrefix 또는 Exact.
  paths:
    first:
      type: "PathPrefix"
      value: "/"
  # request/backendRequest 등의 duration. WebSocket은 실제 타임아웃 정책을 확인한다.
  timeouts:
    request: "60s"
    backendRequest: "55s"
# 노드의 workload 라벨과 일치시킨다.
nodeSelector:
  workload: "general"
# 해당 워커 그룹의 dedicated taint를 허용한다.
toleration:
  key: "dedicated"
  operator: "Equal"
  value: "general"
  effect: "NoSchedule"
