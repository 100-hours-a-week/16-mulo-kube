# CPU 사용률을 보고 Pod 수를 늘리고 줄인다. 늘린 Pod가 노드에 안 들어가면 Cluster Autoscaler가 노드를 늘린다.
# Deployment에는 replicas를 적지 않는다. 적으면 Argo CD 동기화 때마다 HPA가 정한 수를 되돌린다.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.app.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.app.name }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilization }}
  behavior:
    # 줄일 때는 부하가 다시 오를 수 있으니 기다렸다가 한 번에 1개씩 줄인다.
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.autoscaling.scaleDownStabilizationSeconds }}
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
