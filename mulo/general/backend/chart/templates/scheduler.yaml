{{- if .Values.scheduler.enabled }}
# 예약 작업(@Scheduled) 전용 Pod 1개. Service selector(app: backend)와 라벨이 달라 사용자 요청은 받지 않는다.
# 알림 등은 Redis Pub/Sub(SSE 전달)로 web Pod에 붙은 사용자에게 간다.
# 이 Pod가 있는 AZ가 죽으면 다른 AZ에 다시 뜰 때까지(약 5분) 예약 작업만 멈춘다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}-scheduler
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.app.name }}-scheduler
spec:
  minReadySeconds: {{ .Values.minReadySeconds }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  # 롤링 업데이트는 잠깐 2개가 겹쳐 예약 작업이 중복될 수 있으므로, 옛 Pod를 먼저 내리고 새 Pod를 띄운다.
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.app.name }}-scheduler
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}-scheduler
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      # 노드에 설정한 workload 라벨과 dedicated taint를 사용한다.
      nodeSelector:
        workload: {{ .Values.nodeSelector.workload }}
      tolerations:
        - key: {{ .Values.toleration.key }}
          operator: {{ .Values.toleration.operator }}
          value: {{ .Values.toleration.value }}
          effect: {{ .Values.toleration.effect }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
{{- include "backend.containers" (dict "root" $ "scheduling" "true") | nindent 8 }}
{{- end }}
