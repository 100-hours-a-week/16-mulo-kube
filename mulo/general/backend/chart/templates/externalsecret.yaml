# Vault 필드를 backend의 환경변수 이름으로 동기화한다.
# Vault 서버·KV 값·Kubernetes auth 역할과 ESO를 먼저 준비한다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.app.name }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.app.name }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef.name }}
    kind: {{ .Values.externalSecrets.storeRef.kind }}
  target:
    name: {{ .Values.externalSecrets.targetName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.externalSecrets.data.dbPassword.secretKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.data.dbPassword.remoteRef.key }}
        property: {{ .Values.externalSecrets.data.dbPassword.remoteRef.property }}
    - secretKey: {{ .Values.externalSecrets.data.jwtSecret.secretKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.data.jwtSecret.remoteRef.key }}
        property: {{ .Values.externalSecrets.data.jwtSecret.remoteRef.property }}
    - secretKey: {{ .Values.externalSecrets.data.kakaoRestApiKey.secretKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.data.kakaoRestApiKey.remoteRef.key }}
        property: {{ .Values.externalSecrets.data.kakaoRestApiKey.remoteRef.property }}
    - secretKey: {{ .Values.externalSecrets.data.kmaServiceKey.secretKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.data.kmaServiceKey.remoteRef.key }}
        property: {{ .Values.externalSecrets.data.kmaServiceKey.remoteRef.property }}
    - secretKey: {{ .Values.externalSecrets.data.spotifyClientId.secretKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.data.spotifyClientId.remoteRef.key }}
        property: {{ .Values.externalSecrets.data.spotifyClientId.remoteRef.property }}
    - secretKey: {{ .Values.externalSecrets.data.spotifyClientSecret.secretKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.data.spotifyClientSecret.remoteRef.key }}
        property: {{ .Values.externalSecrets.data.spotifyClientSecret.remoteRef.property }}
    - secretKey: {{ .Values.externalSecrets.data.aiInternalToken.secretKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.data.aiInternalToken.remoteRef.key }}
        property: {{ .Values.externalSecrets.data.aiInternalToken.remoteRef.property }}
    - secretKey: {{ .Values.externalSecrets.data.chatInternalApiKey.secretKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.data.chatInternalApiKey.remoteRef.key }}
        property: {{ .Values.externalSecrets.data.chatInternalApiKey.remoteRef.property }}
    - secretKey: {{ .Values.externalSecrets.data.chatAuthVerifyApiKey.secretKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.data.chatAuthVerifyApiKey.remoteRef.key }}
        property: {{ .Values.externalSecrets.data.chatAuthVerifyApiKey.remoteRef.property }}
