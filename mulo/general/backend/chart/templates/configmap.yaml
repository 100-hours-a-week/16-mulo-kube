# 비밀이 아닌 환경변수만 담는다. 비밀번호와 토큰은 여기에 넣지 않는다(Vault → ExternalSecret).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configMap.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.app.name }}
data:
  {{- range $k, $v := .Values.configMap.data }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
