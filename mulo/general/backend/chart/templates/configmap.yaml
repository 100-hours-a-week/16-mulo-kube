# 비밀이 아닌 환경변수만 담는다. 비밀번호와 토큰은 여기에 넣지 않는다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configMap.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.app.name }}
data:
  TZ: "{{ .Values.configMap.data.TZ }}"
  SPRING_PROFILES_ACTIVE: "{{ .Values.configMap.data.SPRING_PROFILES_ACTIVE }}"
  SERVER_PORT: "{{ .Values.configMap.data.SERVER_PORT }}"
  DB_URL: "{{ .Values.configMap.data.DB_URL }}"
  DB_USERNAME: "{{ .Values.configMap.data.DB_USERNAME }}"
  REDIS_HOST: "{{ .Values.configMap.data.REDIS_HOST }}"
  REDIS_PORT: "{{ .Values.configMap.data.REDIS_PORT }}"
  MEMORY_SEARCH_CONVERSATION_STORE: "{{ .Values.configMap.data.MEMORY_SEARCH_CONVERSATION_STORE }}"
  MEMORY_SEARCH_CONVERSATION_ENVIRONMENT: "{{ .Values.configMap.data.MEMORY_SEARCH_CONVERSATION_ENVIRONMENT }}"
  MULO_MUSIC_SEARCH_RATE_LIMIT_NAMESPACE: "{{ .Values.configMap.data.MULO_MUSIC_SEARCH_RATE_LIMIT_NAMESPACE }}"
  MULO_RABBITMQ_ENABLED: "{{ .Values.configMap.data.MULO_RABBITMQ_ENABLED }}"
  MULO_AI_DB_ENABLED: "{{ .Values.configMap.data.MULO_AI_DB_ENABLED }}"
  AI_BASE_URL: "{{ .Values.configMap.data.AI_BASE_URL }}"
  AI_MOCK_ENABLED: "{{ .Values.configMap.data.AI_MOCK_ENABLED }}"
  CHAT_SERVER_BASE_URL: "{{ .Values.configMap.data.CHAT_SERVER_BASE_URL }}"
