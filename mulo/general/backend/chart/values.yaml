# 초기 구축용 고정 구성이다. Helm --namespace도 이 값과 같게 지정한다.
# 앱 이미지는 ECR에 게시된 태그로 지정하며, 비밀 값은 Git에 넣지 않는다.
namespace: "backend"
app:
  # 리소스 이름과 Pod의 app 라벨이다. Service selector도 같은 값을 참조한다.
  name: "backend"
# Pod 수는 HPA가 정한다(Cloud Wiki 3.10). 장애 대비로 최소 2개에서 시작한다.
# maxReplicas는 부하테스트 전 초기 상한이다. 측정 결과를 보고 조정하고, foundation의 ResourceQuota도 같이 맞춘다.
autoscaling:
  minReplicas: 2
  maxReplicas: 4
  # Pod CPU 사용률(requests 대비 %)이 이 값을 넘으면 늘린다.
  targetCPUUtilization: 70
  scaleDownStabilizationSeconds: 300
  # KEDA(ScaledObject)로 Prometheus 지표 기반 오토스케일링. false면 기존 CPU HPA를 쓴다.
  keda:
    enabled: true
    prometheusAddress: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
    # 기동 직후 Pod의 CPU는 사용률 계산에서 뺀다(초).
    startupGraceSeconds: 180
    # 요청 수(RPS) 기준 추가 지표: Pod 1개당 초당 요청이 이 값을 넘으면 늘린다(Actuator 메트릭, ServiceMonitor 필요).
    extraTriggers:
      - type: prometheus
        name: http-rps
        metricType: AverageValue
        metadata:
          serverAddress: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
          query: sum(rate(http_server_requests_seconds_count{namespace="backend",job="backend",uri!~"/actuator.*"}[2m]))
          threshold: "50"
  # 노드를 비울 때 최소 이만큼은 살아 있게 한다.
  pdbMinAvailable: 1
# Ready가 된 뒤 안정 상태로 인정할 때까지의 시간(초, 0 이상).
minReadySeconds: 5
# 롤백에 남겨 둘 ReplicaSet 수(정수).
revisionHistoryLimit: 3
strategy:
  # 추가 Pod 허용 수/비율. 숫자 또는 "25%" 같은 문자열.
  maxSurge: 1
  # 배포 중 사용 불가 Pod 허용 수/비율. maxSurge와 둘 다 0일 수 없다.
  maxUnavailable: 0
image:
  # ECR 등 실제 이미지 저장소 URI. 태그를 포함하지 않는다.
  repository: "840255883218.dkr.ecr.ap-northeast-2.amazonaws.com/mulo-v3-prod/backend"
  # ECR에 존재하는 배포 이미지 태그다.
  tag: "1.17.0"
  # Always / IfNotPresent / Never 중 선택.
  pullPolicy: "IfNotPresent"
service:
  # ClusterIP Service 이름이다. HTTPRoute가 이 Service로 전달한다.
  name: "backend"
  # 서비스가 수신하는 포트와 컨테이너가 실제 수신하는 포트(1~65535).
  port: 80
  targetPort: 8080
  # HTTPRoute·메트릭 설정에서 식별할 포트 이름.
  portName: "http"
configMap:
  # Deployment의 envFrom이 이 이름으로 ConfigMap을 참조한다.
  name: "backend-config"
  # BE main의 application.yaml 및 application-prod.yaml이 읽는 환경변수 이름이다.
  # 이미지 저장소는 S3다. 인증은 general 노드의 EC2 역할(mulo-v3-prod-api, images 버킷 전용 권한)로 하며 키를 넣지 않는다.
  data:
    TZ: "Asia/Seoul"
    JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul"
    SPRING_PROFILES_ACTIVE: "prod,popular-cache"
    SERVER_PORT: "8080"
    DB_URL: "jdbc:mysql://mulo-v3-prod-api.c9acwe6m8g1e.ap-northeast-2.rds.amazonaws.com:3306/mulo?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Seoul&sessionVariables=time_zone='Asia/Seoul'"
    DB_USERNAME: "mulo_admin"
    REDIS_HOST: "redis.redis.svc.cluster.local"
    REDIS_PORT: "6379"
    MULO_REDIS_COMMANDTIMEOUT: "1s"
    MULO_POPULAR_CACHE_ENABLED: "true"
    MULO_POPULAR_CACHE_TTL: "300s"
    MEMORY_SEARCH_CONVERSATION_STORE: "redis"
    MEMORY_SEARCH_CONVERSATION_ENVIRONMENT: "prod"
    MULO_MUSIC_SEARCH_RATE_LIMIT_NAMESPACE: "mulo:music-search-rate-limit:prod"
    MULO_RABBITMQ_ENABLED: "false"
    # AI DB 읽기 전용 계정. 비밀번호는 SSM /mulo-v3-prod/db/ai/reader-password → Vault MULO_AI_DB_PASSWORD.
    MULO_AI_DB_ENABLED: "true"
    MULO_AI_DB_URL: "jdbc:postgresql://mulo-v3-prod-ai.c9acwe6m8g1e.ap-northeast-2.rds.amazonaws.com:5432/muro_ai?sslmode=require"
    MULO_AI_DB_USERNAME: "mulo_be_reader"
    MULO_GROUP_CHAT_ENABLED: "true"
    MULO_GROUP_CHAT_START_DATE: "2026-10-22"
    AI_BASE_URL: "http://ai-api.ai-api.svc.cluster.local:80"
    AI_MOCK_ENABLED: "false"
    CHAT_SERVER_BASE_URL: "http://chat.chat.svc.cluster.local:80"
    # 이미지 업로드 저장소(S3). 버킷은 Terraform storage.tf의 images 버킷.
    STORAGE_PROVIDER: "s3"
    AWS_REGION: "ap-northeast-2"
    AWS_S3_BUCKET: "mulo-v3-prod-840255883218-images"
# 2026-11-19 VPA 추천 반영(VPA target 100m/561Mi, 기동 시 CPU 최대 0.65). 트래픽이 쌓이면 `kubectl -n <ns> describe vpa <앱>`의 Target으로 다시 맞춘다.
# 메모리 request = VPA target 올림, CPU request = VPA target(기동 시 CPU 급증으로 KEDA가 늘지 않게 여유), limit = 기존 수준(JVM 힙이 limit 기준).
resources:
  requests:
    cpu: "200m"
    memory: "640Mi"
  limits:
    cpu: "1"
    memory: "1536Mi"
# 실제 앱 소스에서 확인한 포트와 헬스체크 경로다.
probes:
  startup:
    # 실제 앱에서 응답하는 기동 확인 경로와 포트.
    path: "/actuator/health"
    port: 8080
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60
  liveness:
    # 프로세스 복구가 필요한 상황만 실패시키는 생존 확인 경로.
    path: "/actuator/health"
    port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    # 트래픽을 받을 수 있는지 판단하는 준비 확인 경로.
    path: "/actuator/health"
    port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
serviceAccount:
  name: "backend"
  # Kubernetes API 토큰이 필요한 앱만 true. 일반 앱은 false.
  automountServiceAccountToken: false
# Pod 종료 전 유예 시간(초).
terminationGracePeriodSeconds: 30
securityContext:
  allowPrivilegeEscalation: false
  # Pod에서 제거할 리눅스 권한. ALL이면 전부 제거한다.
  dropCapability: "ALL"
# 기존 GCP URL map의 /api·/image 경로를 보존한다. 실제 앱 URI와 대조한다.
httpRoute:
  # 연결할 Gateway의 이름, namespace, listener 이름.
  parentRef:
    name: "mulo-gateway"
    namespace: "edge"
    sectionName: "http"
  # 이 서비스가 소유한 실제 호스트 이름.
  hostnames:
    primary: "api.mulostudio.com"
    secondary: "mulostudio.com"
    # 메인 도메인은 업체 DNS에서 CNAME을 걸 수 없어 www로 서비스한다.
    www: "www.mulostudio.com"
  # 이 서비스로 보낼 경로. type은 PathPrefix 또는 Exact.
  paths:
    first:
      type: "PathPrefix"
      value: "/api"
    second:
      type: "PathPrefix"
      value: "/image"
  # request/backendRequest 등의 duration. WebSocket은 실제 타임아웃 정책을 확인한다.
  timeouts:
    request: "60s"
    backendRequest: "55s"

# Vault의 비밀 값을 ESO가 backend-secrets로 동기화한다. 값 자체는 Git에 적지 않는다.
externalSecrets:
  refreshInterval: "1h"
  storeRef:
    name: "mulo-vault"
    kind: "ClusterSecretStore"
  # Deployment의 secretRef가 이 Secret 이름을 직접 참조한다.
  targetName: "backend-secrets"
  # mulo/prod/apps/backend의 모든 키(JWT_SECRET, KAKAO_REST_API_KEY, KMA_SERVICE_KEY,
  # SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET, AI_INTERNAL_TOKEN, CHAT_INTERNAL_API_KEY,
  # CHAT_AUTH_VERIFY_API_KEY, MULO_SECURITY_ALLOWED_ORIGINS, REPORT_OPERATION_TOKEN 등)를
  # 키 이름 그대로 환경변수로 넣는다. 키를 추가하면 차트 수정 없이 반영된다.
  extractKey: "mulo/prod/apps/backend"
  # 소문자로 저장된 키만 환경변수 이름으로 바꿔 준다.
  data:
    dbPassword:
      secretKey: "DB_PASSWORD"
      remoteRef:
        key: "mulo/prod/apps/backend"
        property: "db_password"
# 노드의 workload 라벨과 일치시킨다.
nodeSelector:
  workload: "general"
# 해당 워커 그룹의 dedicated taint를 허용한다.
toleration:
  key: "dedicated"
  operator: "Equal"
  value: "general"
  effect: "NoSchedule"
# Spring Actuator 메트릭 수집(ServiceMonitor). /actuator/prometheus는 클러스터 내부(Service 8080)로만 수집하고 외부 라우트에는 열지 않는다.
serviceMonitor:
  enabled: true
  path: "/actuator/prometheus"
  interval: "15s"
  scrapeTimeout: "10s"
# VPA 추천(updateMode Off). 추천 범위의 하한/상한. 추천값을 보고 위 resources를 사람이 고친다.
vpa:
  enabled: true
  minAllowed:
    cpu: "100m"
    memory: "512Mi"
  maxAllowed:
    cpu: "2"
    memory: "3Gi"
