# 무중단 이전(GCP에서 AWS) 카나리 기간 전용 값이다. values.yaml 위에 겹쳐 쓴다.
# 이 기간의 AWS Backend는 아직 GCP의 DB와 GCS를 그대로 쓴다. AWS RDS는 GCP를 따라가는 복제본(읽기 전용)이라 앱이 쓸 수 없다.
# DB를 승격한 뒤에는 50-backend.yaml의 valueFiles에서 이 파일을 빼고, 이 파일도 지운다. 그러면 values.yaml의 최종 설정(RDS, S3)으로 돌아간다.
# 근거와 순서는 ktb-final-muro 저장소의 docs/design/07-v3-무중단-마이그레이션 런북 v2 5.3, 0.4를 본다.

# Backend DB 승격 때 쓰기를 붙잡던 ProxySQL. 2026-11-21 02:05에 승격하고 03:10에 앱을 RDS 직접 연결로 돌려서 역할이 끝났다.
# 끄면 ArgoCD(prune)가 프록시 Deployment, Service, ConfigMap, PDB를 지운다. 차트 템플릿(templates/dbproxy.yaml)은
# 같은 일이 다시 필요할 때를 위해 남겨 둔다.
dbProxy:
  enabled: false

# 승격 뒤 예약 작업은 AWS Backend에서 돈다. Backend 코드에 중복 실행 방지(ShedLock 등)가 없어서
# 파드가 2개 이상이면 같은 작업이 여러 번 돈다. 전용 파드가 생길 때까지 파드를 1개로 고정한다.
# (줄일 때 기다리지 않게 scaleDownStabilizationSeconds도 0으로 한다. 전용 스케줄러 파드가 생기면 되돌린다.)
autoscaling:
  minReplicas: 1
  maxReplicas: 1
  scaleDownStabilizationSeconds: 0

configMap:
  data:
    # --- DB: 승격 뒤 RDS에 직접 붙는다(2026-11-21). DB_URL은 이 파일에서 덮어쓰지 않고 values.yaml의 RDS 주소를 쓴다. ---
    # (이전 값: ProxySQL jdbc:mysql://backend-db-proxy.backend.svc.cluster.local:6033/mulo?... 쓰기 붙잡기용이라 승격과 함께 역할이 끝났다)
    # 연결 풀(20, 30초)과 Flyway 끄기도 프록시 때문에 넣었던 것이라 뺐다. values.yaml 기본값(풀 3, 대기 5초, Flyway 켬)으로 돌아간다.
    # 계정은 RDS에 만들어 둔 fullstack을 그대로 쓴다(비밀번호는 아래 db_password_gcp). 정식 계정(mulo_admin 등) 정리는 따로 한다.
    DB_USERNAME: "fullstack"
    # AI DB는 2026-11-21 02:05에 RDS로 승격했다. MULO_AI_DB_URL은 이 파일에서 덮어쓰지 않고 values.yaml의 RDS 주소를 쓴다.
    # (이전 값: jdbc:postgresql://10.91.0.7:5432/muro_ai, GCP Cloud SQL. 승격 뒤에는 멈춘 옛 복사본이라 읽으면 새 투표 질문이 안 보인다)

    # --- DB 승격 뒤: GCP Backend를 멈췄으므로 예약 작업은 AWS Backend 파드 1개에서만 돈다 (BE 2fec3f6 이후 이미지) ---
    MULO_SCHEDULING_ENABLED: "true"
    MULO_RABBITMQ_ENABLED: "false"
    MULO_DAILY_SONG_SCHEDULER_ENABLED: "false"

    # --- 이미지 저장소: S3 (5.5a에서 gcs에서 전환). AWS_REGION, AWS_S3_BUCKET은 values.yaml 값을 쓴다 ---
    # 5.5a: 사진 저장소를 GCS에서 S3로 전환한다(S3 복사 완료 후). 되돌리려면 "gcs"로 바꾼다. 아래 GCS 설정과 gcpWif는 되돌릴 때를 위해 남겨 둔다.
    STORAGE_PROVIDER: "s3"
    GCP_PROJECT_ID: "project-7b071b48-8637-467a-80d"
    GCS_BUCKET_NAME: "muro-bucket-1"
    # 키 파일 없이 AWS 노드 IAM 역할로 서비스 계정 mulo-aws-backend-gcs의 권한을 빌려 쓴다(impersonation).
    GOOGLE_APPLICATION_CREDENTIALS: "/etc/gcp/credential-config.json"
    GCS_IMPERSONATE_SERVICE_ACCOUNT: "mulo-aws-backend-gcs@project-7b071b48-8637-467a-80d.iam.gserviceaccount.com"

    # --- AI: 2026-11-21 AWS로 옮겼다. (이전 값: http://10.20.0.27:8000, GCP 내부 로드밸런서) ---
    AI_BASE_URL: "http://ai-api.ai-api.svc.cluster.local:80"
    # --- Chat: 2026-11-20 AWS로 옮겼다. (이전 값: http://10.20.0.59:8081, GCP 내부 로드밸런서) ---
    CHAT_SERVER_BASE_URL: "http://chat.chat.svc.cluster.local:80"

# --- 비밀: GCP DB 계정 비밀번호를 Vault의 별도 키에서 가져온다 ---
# Vault mulo/prod/apps/backend 에 아래 두 키를 먼저 넣는다. 값은 GCP Secret Manager mulo-v2-backend-env 의
# DB_PASSWORD, MULO_AI_DB_PASSWORD 와 같다. (Git에는 값을 적지 않는다)
#   db_password_gcp, ai_db_password_gcp
# 나머지 비밀(JWT_SECRET, 내부 토큰, 외부 API 키)은 GCP와 값이 같아야 한다. 런북 5.3 대조 절차를 본다.
externalSecrets:
  data:
    dbPassword:
      secretKey: "DB_PASSWORD"
      remoteRef:
        key: "mulo/prod/apps/backend"
        property: "db_password_gcp"
    # MULO_AI_DB_PASSWORD는 이 파일에서 따로 매핑하지 않는다. Vault mulo/prod/apps/backend의 MULO_AI_DB_PASSWORD 키가
    # dataFrom으로 그대로 들어온다(RDS의 mulo_be_reader 비밀번호). 이전 매핑: ai_db_password_gcp

# GCS 접근용 Workload Identity Federation 설정. 비밀이 없다(대상 URL과 audience뿐이다).
gcpWif:
  enabled: true
  configMapName: "gcp-wif-config"
  mountPath: "/etc/gcp"
  credentialConfig: |
    {
      "universe_domain": "googleapis.com",
      "type": "external_account",
      "audience": "//iam.googleapis.com/projects/953840519216/locations/global/workloadIdentityPools/aws-pool/providers/aws-provider",
      "subject_token_type": "urn:ietf:params:aws:token-type:aws4_request",
      "token_url": "https://sts.googleapis.com/v1/token",
      "credential_source": {
        "environment_id": "aws1",
        "region_url": "http://169.254.169.254/latest/meta-data/placement/availability-zone",
        "url": "http://169.254.169.254/latest/meta-data/iam/security-credentials",
        "regional_cred_verification_url": "https://sts.{region}.amazonaws.com?Action=GetCallerIdentity&Version=2011-06-15",
        "imdsv2_session_token_url": "http://169.254.169.254/latest/api/token"
      },
      "token_info_url": "https://sts.googleapis.com/v1/introspect"
    }
