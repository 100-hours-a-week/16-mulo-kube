# Vault 필드를 앱 환경변수 이름으로 동기화한다. 비밀 값 자체는 기록하지 않는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.app.name }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.app.name }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef.name }}
    kind: {{ .Values.externalSecrets.storeRef.kind }}
  target:
    name: {{ .Values.externalSecrets.targetName }}
    creationPolicy: Owner
  # 앱 경로의 모든 키를 이름 그대로 환경변수로 가져온다(Vault에 대문자 환경변수 이름으로 저장).
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.extractKey }}
  {{- with .Values.externalSecrets.data }}
  # 이름을 바꿔야 하는 키만 개별 매핑한다(dataFrom보다 우선).
  data:
    {{- range $name, $item := . }}
    - secretKey: {{ $item.secretKey }}
      remoteRef:
        key: {{ $item.remoteRef.key }}
        property: {{ $item.remoteRef.property }}
    {{- end }}
  {{- end }}
