{{- if .Values.vpa.enabled }}
# VPA는 추천만 한다(updateMode Off). Pod를 재시작하거나 requests를 바꾸지 않는다.
# 확인: kubectl -n {{ .Values.namespace }} describe vpa {{ .Values.app.name }} → Target/Upper Bound를 values.yaml resources에 반영.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.app.name }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.app.name }}
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: {{ .Values.app.name }}
        controlledResources: ["cpu", "memory"]
        {{- with .Values.vpa.minAllowed }}
        minAllowed:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.vpa.maxAllowed }}
        maxAllowed:
          {{- toYaml . | nindent 10 }}
        {{- end }}
{{- end }}
