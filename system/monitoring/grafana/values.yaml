# release 이름 prometheus/loki, namespace monitoring을 기준으로 데이터소스를 연결했다.
# 관리자 비밀번호는 기존 Secret 또는 Vault/ESO로 준비한다.
# system 노드가 있는 AZ(2a·2c)마다 1개씩. 대시보드는 Git에서 받아 오므로 두 Pod가 같은 대시보드를 보여 준다.
# 로그인 정보는 Pod마다 따로 저장되므로 아래 BackendTrafficPolicy로 같은 사용자를 같은 Pod에 고정한다.
replicas: 2
topologySpreadConstraints:
  -
    maxSkew: 1
    topologyKey: "topology.kubernetes.io/zone"
    whenUnsatisfiable: "DoNotSchedule"
    nodeTaintsPolicy: "Honor"
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: "grafana"
    # 같은 ReplicaSet(버전)의 Pod끼리만 센다. 없으면 롤링 업데이트 중 종료되는 옛 Pod까지 세서 두 Pod가 한 AZ에 몰린다.
    matchLabelKeys:
      - "pod-template-hash"
podDisruptionBudget:
  minAvailable: 1
# Vault mulo/prod/platform/grafana의 admin_user/admin_password를 Store 차트가 이 Secret으로 동기화한다.
admin:
  existingSecret: "grafana-admin"
  userKey: "admin-user"
  passwordKey: "admin-password"
service:
  type: "ClusterIP"
# 초기에는 데이터소스를 values로 관리하고 PVC를 만들지 않는다. UI에서만 만든 대시보드는 재시작 후 사라질 수 있다.
persistence:
  # 대시보드를 Git/ConfigMap으로 관리하면 비활성화할 수 있다.
  enabled: false
  storageClassName: "gp3"
  size: "2Gi"
# 데이터소스 설정 형식:
# datasources.yaml:
# apiVersion: 1
# datasources:
# - name:
# type:                    # prometheus 또는 loki
# url:                     # 클러스터 내부 Service URL
# access: proxy
# isDefault:
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      -
        name: "Prometheus"
        uid: "prometheus"
        type: "prometheus"
        url: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
        access: "proxy"
        isDefault: true
        editable: false
      -
        name: "Loki"
        uid: "loki"
        type: "loki"
        url: "http://loki.monitoring.svc.cluster.local:3100"
        access: "proxy"
        isDefault: false
        editable: false
# Controller는 workload=system 노드에 배치한다.
nodeSelector:
  workload: "system"
# dedicated=system:NoSchedule를 허용하는 toleration 목록을 입력한다.
# 항목: {key: dedicated, operator: Equal, value: system, effect: NoSchedule}
tolerations:
  -
    key: "dedicated"
    operator: "Equal"
    value: "system"
    effect: "NoSchedule"
  # 노드가 죽으면(NotReady·Unreachable) 기본 300초가 아니라 30초 뒤 다른 노드(다른 AZ)로 옮긴다.
  -
    key: "node.kubernetes.io/not-ready"
    operator: "Exists"
    effect: "NoExecute"
    tolerationSeconds: 30
  -
    key: "node.kubernetes.io/unreachable"
    operator: "Exists"
    effect: "NoExecute"
    tolerationSeconds: 30
# CPU/메모리 requests·limits를 실제 노드 용량에 맞춘다.
resources:
  requests:
    cpu: "50m"
    memory: "128Mi"
  limits:
    cpu: "300m"
    memory: "384Mi"
networkPolicy:
  enabled: false
grafana.ini:
  server:
    domain: "grafana.mulostudio.com"
    root_url: "https://grafana.mulostudio.com"
    serve_from_sub_path: false
  security:
    cookie_secure: true
    cookie_samesite: "lax"
  auth.anonymous:
    enabled: false
# 공식 차트의 HTTPRoute를 사용한다. 사용자 선택에 따라 HTTPS 도메인으로 접속하며 별도 접근 정책은 나중에 관리한다.
route:
  main:
    enabled: true
    apiVersion: "gateway.networking.k8s.io/v1"
    kind: "HTTPRoute"
    labels: {}
    hostnames:
      - "grafana.mulostudio.com"
    parentRefs:
      -
        name: "mulo-gateway"
        namespace: "edge"
        sectionName: "http"
    matches:
      -
        path:
          type: "PathPrefix"
          value: "/"
    filters: []
    httpsRedirect: false
    additionalRules: []
# 대시보드는 Git(system/monitoring/grafana/dashboards/)에서 관리한다.
# Grafana 시작 시 download-dashboards init 컨테이너가 GitHub raw URL에서 받아 프로비저닝한다(저장소 public 전제).
# 수정은 JSON을 고쳐 main에 push한 뒤 Grafana Pod를 재시작한다(UI에서 고친 내용은 재시작 시 사라짐).
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: "mulo"
        orgId: 1
        folder: "MULO"
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards/mulo
dashboards:
  mulo:
    mulo-backend:
      url: "https://raw.githubusercontent.com/100-hours-a-week/16-mulo-kube/main/system/monitoring/grafana/dashboards/mulo-backend.json"
# 같은 사용자를 같은 Grafana Pod로 보낸다(Envoy가 쿠키를 만들어 고정). Pod가 죽으면 다른 Pod로 가고 로그인만 다시 하면 된다.
extraObjects:
  -
    apiVersion: "gateway.envoyproxy.io/v1alpha1"
    kind: "BackendTrafficPolicy"
    metadata:
      name: "grafana-session-affinity"
      namespace: "monitoring"
    spec:
      targetRefs:
        -
          group: "gateway.networking.k8s.io"
          kind: "HTTPRoute"
          name: "grafana"
      loadBalancer:
        type: "ConsistentHash"
        consistentHash:
          type: "Cookie"
          cookie:
            name: "mulo-grafana-affinity"
            ttl: "24h"
