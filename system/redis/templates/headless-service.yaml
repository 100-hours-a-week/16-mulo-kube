# StatefulSet Pod의 고정 DNS에 사용하는 Service다. 앱은 기존 redis Service로 접속한다.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-headless
  namespace: {{ .Values.namespace }}
spec:
  clusterIP: None
  # 준비되기 전에도 Pod DNS 이름이 풀려야 Sentinel·replica가 서로를 찾을 수 있다.
  publishNotReadyAddresses: true
  selector:
    app: {{ .Values.name }}
  ports:
    - name: redis
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: redis
