# HAProxy 2개: 앱 연결을 지금 master인 Redis로만 넘긴다(TCP 그대로 전달, Pub/Sub 포함).
# 1초마다 각 Redis에 "INFO replication"을 보내 role:master인 쪽만 정상으로 본다.
# master가 바뀌면 옛 master로 가던 연결을 끊어(on-marked-down shutdown-sessions) 앱이 새 master로 다시 붙게 한다.
{{- $n := .Values.name }}
{{- $ns := .Values.namespace }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $n }}-haproxy
  namespace: {{ $ns }}
spec:
  replicas: {{ .Values.haproxy.replicas }}
  selector:
    matchLabels:
      app: {{ $n }}-haproxy
  template:
    metadata:
      labels:
        app: {{ $n }}-haproxy
      annotations:
        # 설정이 바뀌면 다시 시작해 새 설정을 읽는다.
        checksum/config: {{ include (print $.Template.BasePath "/haproxy-config.yaml") . | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload: system
      tolerations:
        - key: dedicated
          operator: Equal
          value: system
          effect: NoSchedule
        # 노드가 죽으면 30초 뒤 다른 노드로 옮긴다(기본 300초).
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: {{ $n }}-haproxy
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: haproxy
          image: "{{ .Values.haproxy.image }}"
          ports:
            - name: redis
              containerPort: {{ .Values.service.targetPort }}
            - name: health
              containerPort: 8404
          resources:
            {{- toYaml .Values.haproxy.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            # 이미지의 haproxy 사용자(UID 99). 이름만 있으면 runAsNonRoot를 확인할 수 없어 숫자로 지정한다.
            runAsNonRoot: true
            runAsUser: 99
            runAsGroup: 99
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ $n }}-haproxy
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $n }}-haproxy
  namespace: {{ $ns }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ $n }}-haproxy
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $n }}
  namespace: {{ $ns }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ $n }}
