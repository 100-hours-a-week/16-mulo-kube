# 앱(backend·chat)이 접속하는 주소. HAProxy로 보내고, HAProxy가 지금 master인 Redis로만 넘긴다.
# 클러스터 내부 앱만 접근한다. 외부 LoadBalancer는 만들지 않는다.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.name }}-haproxy
  ports:
    - name: redis
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: redis
