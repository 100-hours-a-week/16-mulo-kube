# 앱 HPA가 읽는 CPU·메모리 metrics API(metrics.k8s.io)를 제공한다. 이게 멈추면 HPA도 멈춘다.
# HPA가 쓰므로 2개로 두고 PDB를 건다.
replicas: 2
# 2개를 AZ마다 1개씩 둔다. 이 차트는 labelSelector를 채우지 않으므로 Pod 라벨을 직접 지정한다.
topologySpreadConstraints:
  -
    maxSkew: 1
    topologyKey: "topology.kubernetes.io/zone"
    whenUnsatisfiable: "DoNotSchedule"
    nodeTaintsPolicy: "Honor"
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: "metrics-server"
    matchLabelKeys:
      - "pod-template-hash"
podDisruptionBudget:
  enabled: true
  minAvailable: 1
args:
  - "--kubelet-preferred-address-types=InternalIP,Hostname"
  # kubeadm kubelet의 서빙 인증서는 self-signed다. 검증하려면 노드마다 serverTLSBootstrap과 CSR 승인이 필요한데,
  # CA가 노드를 자동으로 늘릴 때마다 사람이 CSR을 승인할 수 없어 검증을 건너뛴다.
  # 접속 대상은 VPC 안의 노드 IP:10250이고, 보안 그룹이 system 노드에서만 이 포트를 연다. Prometheus의 kubelet 수집도 같은 방식이다.
  - "--kubelet-insecure-tls"
# 공식 차트 기본값대로 aggregation 구간의 자체 서빙 인증서를 허용한다.
apiService:
  create: true
  # Metrics Server의 서빙 인증서와 API aggregation 신뢰 설정에 맞춰 결정한다.
  insecureSkipTLSVerify: true
  caBundle: ""
# Controller는 workload=system 노드에 배치한다.
nodeSelector:
  workload: "system"
# dedicated=system:NoSchedule를 허용하는 toleration 목록을 입력한다.
# 항목: {key: dedicated, operator: Equal, value: system, effect: NoSchedule}
tolerations:
  -
    key: "dedicated"
    operator: "Equal"
    value: "system"
    effect: "NoSchedule"
# CPU/메모리 requests·limits를 실제 노드 용량에 맞춘다.
resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"
