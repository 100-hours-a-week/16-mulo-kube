# ALB의 실제 target group 포트 30080과 health 경로를 Terraform state에서 확인했다.
# Envoy 데이터 플레인과 Gateway 리소스를 둘 namespace. --namespace와 맞춘다.
namespace: "edge"
# GatewayClass는 클러스터 전체 이름, 나머지는 위 namespace 안의 이름이다.
className: "mulo-envoy"
gatewayName: "mulo-gateway"
proxyName: "mulo-envoy-proxy"
listener:
  name: "http"
  # ALB 뒤 내부 HTTP listener 포트. HTTPS 종료는 ALB에서 수행할 수 있다.
  port: 80
# mulo.io/gateway-access 라벨이 이 값인 namespace의 HTTPRoute만 연결한다.
# foundation의 namespace.yaml 라벨과 같은 값이어야 한다.
gatewayAccessLabel: "true"
envoy:
  # 사용자 트래픽 입구라 2개 아래로 내려가지 않게 한다. CPU가 오르면 HPA가 늘린다.
  autoscaling:
    # AZ마다 2개씩(general 노드마다 2개) 최소 4개.
    minReplicas: 4
    maxReplicas: 8
    targetCPUUtilization: 70
  pdbMinAvailable: 1
  # Terraform의 config.envoy_node_port와 동일한 NodePort(30000~32767).
  nodePort: 30080
  # 선택한 PriorityClass 이름. foundation에 먼저 정의한다.
  priorityClassName: "mulo-edge"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
# ALB가 Host 헤더 없이 확인할 헬스체크 경로다. 항상 생성한다.
health:
  # Terraform의 envoy_health_path와 같은 경로. ALB 헬스체크는 도메인 Host를 보내지 않는다.
  path: "/healthz"

# Gateway 전체에 거는 장애 대응(BackendTrafficPolicy). 2026-11-24 2c 장애 훈련에서 죽은 Pod로 가는 요청이 멈춘 문제 대응.
resilience:
  # 백엔드 Pod TCP 연결 대기. 기본은 10초다.
  connectTimeout: "1s"
  retry:
    # 요청이 전달되기 전 실패(연결 실패 등)만 다른 Pod로 다시 보낸다.
    numRetries: 2
    baseInterval: "50ms"
    maxInterval: "500ms"
  passive:
    # 연속 연결 실패 2번이면 그 Pod를 뺀다.
    consecutiveLocalOriginFailures: 2
    # 502·503·504가 연속 5번이면 뺀다.
    consecutiveGatewayErrors: 5
    interval: "2s"
    # 처음 30초 빼고, 다시 실패하면 점점 길게 뺀다.
    baseEjectionTime: "30s"
    maxEjectionPercent: 50
