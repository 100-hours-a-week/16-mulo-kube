# 노드 증설용 Cluster Autoscaler다. 늘어난 Pod가 노드에 안 들어가 Pending이 되면 해당 역할의 ASG desired를 늘린다.
# 노드가 한동안 덜 쓰이면 Pod를 옮기고 노드를 줄인다. Karpenter 대신 CA를 고른 이유는 Cloud Wiki 3.2에 있다.
#
# AWS 인증: kubeadm에는 IRSA가 없어 system 노드의 EC2 역할을 쓴다(IMDSv2 hop limit 2).
# Terraform의 cluster_autoscaler_use_node_role = true가 이 역할에 ASG 조회·크기 변경 권한을 붙인다.
cloudProvider: "aws"
awsRegion: "ap-northeast-2"
# ASG 태그 k8s.io/cluster-autoscaler/enabled와 k8s.io/cluster-autoscaler/mulo-v3-prod가 붙은 ASG만 다룬다.
# 역할별 min/max는 Terraform workers의 min/max를 그대로 따른다.
autoDiscovery:
  clusterName: "mulo-v3-prod"
image:
  # 클러스터 Kubernetes 마이너 버전(1.36)과 맞춘다.
  tag: "v1.36.0"
# system 워커가 서로 다른 AZ 2곳에 1대씩 있으므로 AZ마다 1개씩 2개를 둔다. 리더 선출(기본 켜짐)로 한 개만 활성이다.
# 한 AZ에만 있으면 정작 AZ 장애 때 남은 AZ 노드를 늘려야 할 CA가 같이 죽는다.
replicaCount: 2
podDisruptionBudget:
  maxUnavailable: 1
# 빈 labelSelector와 pod-template-hash를 함께 쓰면 같은 ReplicaSet의 CA Pod만 센다(차트 라벨 이름에 의존하지 않음).
topologySpreadConstraints:
  -
    maxSkew: 1
    topologyKey: "topology.kubernetes.io/zone"
    whenUnsatisfiable: "DoNotSchedule"
    nodeTaintsPolicy: "Honor"
    labelSelector: {}
    matchLabelKeys:
      - "pod-template-hash"
rbac:
  serviceAccount:
    create: true
    name: "cluster-autoscaler"
extraArgs:
  # 노드 그룹마다 역할이 달라 크기를 맞춰 늘릴 필요가 없다.
  balance-similar-node-groups: "false"
  # Pending Pod를 넣었을 때 남는 자원이 가장 적은 그룹을 고른다.
  expander: "least-waste"
  # Redis·Vault·Prometheus·Loki처럼 PVC가 있는 노드도 줄일 수 있게 한다. EBS는 같은 AZ의 다른 노드로 다시 붙는다.
  skip-nodes-with-local-storage: "false"
  scale-down-enabled: "true"
  # requests 합이 노드의 50% 미만인 상태가 10분 넘게 이어지면 줄일 후보로 본다.
  scale-down-utilization-threshold: "0.5"
  scale-down-unneeded-time: "10m"
  # 막 늘린 뒤에는 10분 동안 줄이지 않는다.
  scale-down-delay-after-add: "10m"
  # EC2 부팅·ECR 준비·kubeadm join까지 15분 안에 Ready가 안 되면 실패로 보고 다른 방법을 찾는다.
  max-node-provision-time: "15m"
nodeSelector:
  workload: "system"
tolerations:
  -
    key: "dedicated"
    operator: "Equal"
    value: "system"
    effect: "NoSchedule"
resources:
  requests:
    cpu: "50m"
    memory: "128Mi"
  limits:
    cpu: "300m"
    memory: "512Mi"
